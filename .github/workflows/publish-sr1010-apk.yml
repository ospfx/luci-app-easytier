name: Publish SR1010 APK from build artifact

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/publish-sr1010-apk.yml'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact from successful build
        uses: actions/download-artifact@v4
        with:
          name: sr1010-immortalwrt-25.12.1-aarch64_cortex-a53-apk
          run-id: 40345471035
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dist
      - name: Select only EasyTier packages
        run: |
          mkdir -p release
          for f in dist/*.apk; do
            b=$(basename "$f")
            case "$b" in
              easytier-*|easytierd-*|luci-app-easytier-*|luci-i18n-easytier-*) cp "$f" release/ ;;
            esac
          done
          ls -l release
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sr1010-immortalwrt-25.12.1-clean
          name: SR1010 ImmortalWrt 25.12.1 APK (EasyTier only)
          body: |
            SR1010 (aarch64_cortex-a53) ImmortalWrt 25.12.1 专用 APK 包。
            仅包含 EasyTier 相关包：easytier、easytier-noweb、easytierd、luci-app-easytier、luci-i18n-easytier-zh-cn。
          files: release/*
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
